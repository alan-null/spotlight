[[actions]]
id = "docker.disk-usage"
title = "Docker disk usage"
description = "Show Docker disk usage"
category = "Docker Maintenance"
command = "docker system df"

[[actions]]
id = "docker.prune"
title = "Docker prune"
description = "Remove unused Docker data after confirmation"
category = "Docker Maintenance"
command = "docker system prune"

[[actions]]
id = "docker.compose-logs"
title = "Docker Compose logs"
description = "Follow the latest 100 log lines"
category = "Docker Compose"
command = "docker compose logs -f --tail=100"

[[actions]]
id = "docker.compose-cleanup"
title = "Docker Compose cleanup"
description = "Stop services and remove orphan containers"
category = "Docker Compose"
command = "docker compose down --remove-orphans"

[[actions]]
id = "docker.compose-up"
title = "Start Docker Compose services"
description = "Start services in detached mode"
category = "Docker Compose"
command = "docker compose up -d"

[[actions]]
id = "docker.compose-restart"
title = "Restart Docker Compose services"
description = "Stop and start services in detached mode"
category = "Docker Compose"
command = "docker compose down; docker compose up -d"

[[actions]]
id = "docker.container-list-all"
title = "List all Docker containers"
description = "Show running and stopped containers"
category = "Docker Containers"
command = "docker container ls -a"

[[actions]]
id = "docker.image-list-all"
title = "List all Docker images"
description = "Show all local images"
category = "Docker Images"
command = "docker images -a"

[[actions]]
id = "docker.image-inspect"
title = "Inspect Docker image"
description = "Choose a local image and show its details"
category = "Docker Images"
command = "docker image inspect <image_id>"

[actions.parameters.image_id]
prompt = "Docker image"
source = "docker image ls --format '{{.ID}}\t{{.Repository}}:{{.Tag}}'"

[[actions]]
id = "docker.image-prune-all"
title = "Prune unused Docker images"
description = "Remove unused images after confirmation"
category = "Docker Images"
command = "docker image prune -a"

[[actions]]
id = "docker.image-remove"
title = "Remove Docker image"
description = "Choose a local image to remove"
category = "Docker Images"
command = "docker image rm <image_id>"

[actions.parameters.image_id]
prompt = "Docker image"
source = "docker image ls --format '{{.ID}}\t{{.Repository}}:{{.Tag}}'"
